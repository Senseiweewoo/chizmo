<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="volt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded App Icon Background -->
  <rect width="192" height="192" rx="42" fill="url(#bg)" />
  
  <!-- Outer Glow Ring -->
  <circle cx="96" cy="96" r="66" fill="none" stroke="#6366F1" stroke-width="4" opacity="0.4" />
  
  <!-- Chizzy Mascot Lightning Bolt -->
  <path
    d="M106 34 L56 102 L92 102 L84 158 L138 90 L102 90 Z"
    fill="url(#volt)"
    filter="url(#glow)"
  />
</svg>
