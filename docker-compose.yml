version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: chizmo-postgres
    restart: always
    environment:
      POSTGRES_USER: chizmo_user
      POSTGRES_PASSWORD: chizmo_password
      POSTGRES_DB: chizmo_db
    ports:
      - "5432:5432"
    volumes:
      - chizmo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chizmo_user -d chizmo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chizmo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - chizmo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chizmo_pgdata:
  chizmo_redisdata:
