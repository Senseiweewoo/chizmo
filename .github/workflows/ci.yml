name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chizmo_user
          POSTGRES_PASSWORD: chizmo_password
          POSTGRES_DB: chizmo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate
        env:
          DATABASE_URL: "postgresql://chizmo_user:chizmo_password@localhost:5432/chizmo_db?schema=public"

      - name: Build Packages
        run: |
          npm run build --workspace=@chizmo/core
          npm run build --workspace=@chizmo/db
          npm run build --workspace=@chizmo/ai
        env:
          DATABASE_URL: "postgresql://chizmo_user:chizmo_password@localhost:5432/chizmo_db?schema=public"

      - name: Run Typechecks
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm run test
